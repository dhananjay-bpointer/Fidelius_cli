name: Deploy Fidelius (Production)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fidelius-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.PRODUCTION_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PRODUCTION_DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          IMAGE: ${{ secrets.PRODUCTION_DOCKERHUB_USERNAME }}/fidelius:${{ github.sha }}
        run: |
          docker buildx build \
            --push \
            --tag "$IMAGE" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Deploy on DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ secrets.PRODUCTION_DOCKERHUB_USERNAME }}/fidelius:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.PRODUCTION_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.PRODUCTION_DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_DO_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_DO_SSH_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker rm -f fidelius || true
            docker run -d \
              --name fidelius \
              --restart unless-stopped \
              -p 8090:8090 \
              "$IMAGE"
